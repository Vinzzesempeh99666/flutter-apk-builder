name: Surya Builder Flutter APK

on:
  push:
    paths:
      - 'source/project.zip'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Unzip project source
        run: |
          mkdir -p build_workspace
          unzip -o source/project.zip -d build_workspace
          if [ ! -f build_workspace/pubspec.yaml ]; then
            inner=$(find build_workspace -maxdepth 2 -name pubspec.yaml | head -n 1)
            if [ -n "$inner" ]; then
              mv "$(dirname "$inner")"/* build_workspace/ 2>/dev/null || true
            fi
          fi

      - name: Validasi pubspec.yaml
        working-directory: build_workspace
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "##[error] pubspec.yaml tidak ditemukan. Pastikan ZIP berisi project Flutter yang valid (pubspec.yaml harus ada di root project)."
            exit 1
          fi
          echo "▶ pubspec.yaml ditemukan. Isi blok environment:"
          grep -A2 "^environment:" pubspec.yaml || echo "  (tidak ada blok 'environment:' eksplisit di pubspec.yaml)"
          echo "▶ Dart/Flutter SDK yang dipakai runner saat ini:"
          flutter --version

      - name: Flutter pub get (dengan fallback)
        working-directory: build_workspace
        run: |
          set +e
          echo "▶ Percobaan 1: flutter pub get"
          OUTPUT=$(flutter pub get 2>&1)
          STATUS=$?
          echo "$OUTPUT"

          if [ $STATUS -ne 0 ] && echo "$OUTPUT" | grep -qi "version solving failed"; then
            echo "―――――――――――――――――――――――――――"
            echo "⚠ Percobaan 1 gagal karena version conflict, coba Percobaan 2: pub get --no-precompile"
            OUTPUT2=$(flutter pub get --no-precompile 2>&1)
            STATUS=$?
            echo "$OUTPUT2"
            [ $STATUS -ne 0 ] && OUTPUT="$OUTPUT2"
          fi

          if [ $STATUS -ne 0 ]; then
            echo "―――――――――――――――――――――――――――"
            echo "##[error] Gagal resolve dependency Flutter project (pubspec.yaml)."
            echo ""
            CONFLICT_LINES=$(echo "$OUTPUT" | grep -iE "^Because|requires (sdk|version)|version solving failed")
            if [ -n "$CONFLICT_LINES" ]; then
              echo "📦 Detail konflik dependency:"
              echo "$CONFLICT_LINES"
              echo ""
            fi
            echo "💡 Kemungkinan penyebab:"
            echo "  - Ada package di pubspec.yaml yang minta Dart SDK lebih baru dari yang tersedia di runner"
            echo "  - Dua package saling bentrok soal versi dependency yang sama"
            echo "  - pubspec.lock usang / tidak sinkron dengan pubspec.yaml"
            echo ""
            echo "🔧 Solusi: sesuaikan versi package yang disebut di atas pada pubspec.yaml project ini, lalu build ulang."
            exit 1
          fi

          echo "✓ flutter pub get berhasil"

      - name: Build release APK
        working-directory: build_workspace
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: surya-builder-apk
          path: build_workspace/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
