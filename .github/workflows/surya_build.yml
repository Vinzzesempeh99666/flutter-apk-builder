name: Surya Builder Flutter APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag berisi ZIP project'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Download & extract project ZIP dari Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          mkdir -p build_workspace
          ASSET_URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | jq -r '.assets[0].url')
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "::error::Tidak menemukan asset ZIP di release $TAG"
            exit 1
          fi
          curl -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$ASSET_URL" -o project.zip
          unzip -o project.zip -d build_workspace
          if [ ! -f build_workspace/pubspec.yaml ]; then
            inner=$(find build_workspace -maxdepth 2 -name pubspec.yaml | head -n 1)
            if [ -n "$inner" ]; then
              mv "$(dirname "$inner")"/* build_workspace/ 2>/dev/null || true
            fi
          fi

      - name: Flutter pub get
        working-directory: build_workspace
        run: flutter pub get

      - name: Build release APK
        working-directory: build_workspace
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: surya-builder-apk
          path: build_workspace/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
